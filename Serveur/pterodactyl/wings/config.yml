# Fichier: config.yml
# Emplacement: Project_homeserver/serveur/pterodactyl/wings/config.yml
# Langage: YAML (configuration Wings)
# Role: modele de reference du fichier genere par le Panel lors de la creation du node -
#       indique a Wings comment s'authentifier aupres du Panel, quels ports utiliser,
#       et ou stocker les donnees des serveurs de jeu geres localement.

debug: false

uuid: A_REMPLACER_PAR_LE_PANEL

token_id: A_REMPLACER_PAR_LE_PANEL
token: A_REMPLACER_PAR_LE_PANEL

api:
  host: 0.0.0.0
  port: 8080
  ssl:
    enabled: false
    cert: /etc/letsencrypt/live/example.com/fullchain.pem
    key: /etc/letsencrypt/live/example.com/privkey.pem
  upload_limit: 100
  
system:
  data: /var/lib/pterodactyl/volumes
  sftp:
    bind_port: 2022
    
remote: "https://192.168.3.10:8443"

allowed_mounts: []

allowed_origins:
  - "https://192.168.3.10:8443"