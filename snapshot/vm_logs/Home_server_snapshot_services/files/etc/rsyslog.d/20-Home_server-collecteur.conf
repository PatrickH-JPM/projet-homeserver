module(load="imudp")
module(load="imtcp")

template(name="HomeServerRaw" type="string" string="%rawmsg%\n")
template(name="HomeServerJSON" type="list" option.jsonf="on") {
 property(outname="date" name="timegenerated" dateFormat="rfc3339" format="jsonf")
 property(outname="source" name="fromhost-ip" format="jsonf")
 property(outname="host" name="hostname" format="jsonf")
 property(outname="severity" name="syslogseverity" format="jsonf")
 property(outname="tag" name="$.tag" format="jsonf")
 property(outname="message" name="msg" format="jsonf")
}

ruleset(name="Home_server_harmoniser") {
  set $.tag = "SYSTEME";
  set $.niveau = "INFO";
  if $syslogseverity <= 3 then set $.niveau = "ALERTE";
  else if $syslogseverity == 4 then set $.niveau = "AVERTISSEMENT";

  if $programname == "Home_server-NETFLOW" then set $.tag = "NETFLOW";
  if $programname == "Home_server-DOCKER" then set $.tag = "DOCKER";
  if $fromhost-ip == "192.168.5.1" then {
    set $.tag = "ROUTER-SYSTEME";
    if re_match(tolower($msg), "wireguard|vpn") then {
      set $.tag = "ROUTER-VPN";
    } else if re_match(tolower($msg), "acl|firewall|blocked|denied") then {
      set $.tag = "ROUTER-ACL";
    }
  } else if ($msg contains "FW-SERVEUR") or ($msg contains "FW-DOCKER") then {
    set $.tag = "FW-SERVEUR";
    set $.niveau = "AVERTISSEMENT";
  } else if $msg contains "FW-HOTE" then {
    set $.tag = "FW-HOTE";
    set $.niveau = "AVERTISSEMENT";
  } else if $programname contains "crowdsec" then {
    set $.tag = "CROWDSEC";
  } else if $programname == "nginx-access" then {
    set $.tag = "NGINX";
  } else if $programname == "nginx-error" then {
    set $.tag = "NGINX";
    set $.niveau = "AVERTISSEMENT";
  } else if $programname == "mc-serveur" then {
    set $.tag = "MC-SERVEUR";
  }
  action(type="omfile" file="/var/log/Home_server/brut.log"
    template="HomeServerRaw" fileOwner="syslog" fileGroup="adm" fileCreateMode="0640")
  action(type="omfile" file="/var/log/Home_server/evenements.jsonl"
    template="HomeServerJSON" fileOwner="syslog" fileGroup="adm" fileCreateMode="0640")
  # Les mails relisent tous les evenements, sans passer par Alloy ou Grafana.

}

input(type="imudp" address="192.168.5.10" port="514"
  ruleset="Home_server_harmoniser")
input(type="imtcp" address="192.168.5.10" port="1514"
  ruleset="Home_server_harmoniser")

# Les messages locaux sont également harmonisés.
call Home_server_harmoniser
