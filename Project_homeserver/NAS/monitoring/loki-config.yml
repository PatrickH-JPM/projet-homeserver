# Fichier: loki-config.yml
# Emplacement: Project_homeserver/nas/monitoring/loki-config.yml
# Langage: YAML (configuration Loki)
# Role: configure le stockage et le fonctionnement de Loki, la base de donnees
#       qui recoit les logs envoyes par Promtail et les rend interrogeables par Grafana.

auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
ruler:
  alertmanager_url: http://localhost:9093