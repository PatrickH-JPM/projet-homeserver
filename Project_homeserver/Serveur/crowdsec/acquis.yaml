# Fichier: acquis.yaml
# Emplacement: Project_homeserver/serveur/crowdsec/acquis.yaml
# Langage: YAML (configuration CrowdSec)
# Role: indique a CrowdSec quels fichiers de logs lire sur le serveur,
#       et quel type d'analyse appliquer a chacun (SSH, pare-feu).

---
filenames:
  - /var/log/auth.log
labels:
  type: syslog
---
filenames:
  - /var/log/ufw.log
labels:
  type: syslog
