# Fichier: nginx.conf
# Emplacement: Project_homeserver/NAS/reverse-proxy/nginx.conf
# Langage: configuration Nginx
# Role: reverse proxy HTTPS unique pour le Panel Pterodactyl et Grafana - route selon
#       le nom d'hote demande, chiffre le trafic avec le certificat local, et redirige
#       tout acces HTTP vers HTTPS.

user  nginx;
worker_processes  auto;
events {
    worker_connections  1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server {
        listen 80;
        server_name panel.homeserver.local grafana.homeserver.local wings.homeserver.local;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name panel.homeserver.local;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        client_max_body_size 100m;
        location / {
            proxy_pass http://panel:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
    server {
        listen 443 ssl;
        server_name grafana.homeserver.local;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
    server {
        listen 443 ssl;
        server_name wings.homeserver.local;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        client_max_body_size 100m;
        location / {
            proxy_pass http://192.168.3.10:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}