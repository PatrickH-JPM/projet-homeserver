# Fichier: docker-compose.yml
# Emplacement: Project_homeserver/NAS/reverse-proxy/docker-compose.yml
# Langage: YAML (Docker Compose)
# Role: lance nginx comme point d'entree web unique - recoit tout le trafic HTTPS
#       sur 443 et le repartit vers le Panel ou Grafana selon le nom d'hote demande.

version: "3.8"

networks:
  homeserver-net:
    external: true

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
    networks:
      - homeserver-net
