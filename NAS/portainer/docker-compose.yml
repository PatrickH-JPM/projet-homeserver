# Fichier: docker-compose.yml
# Emplacement: Project_homeserver/nas/portainer/docker-compose.yml
# Langage: YAML (Docker Compose)
# Role: lance Portainer, l'interface web de gestion visuelle des conteneurs Docker
#       (demarrer/arreter/redemarrer, consulter les logs, voir l'etat CPU/RAM).

services:
  portainer:
    image: portainer/portainer-ce:2.21.0
    container_name: portainer
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    restart: unless-stopped

volumes:
  portainer-data:
