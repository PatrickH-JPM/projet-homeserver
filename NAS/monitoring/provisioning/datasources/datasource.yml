# Fichier: datasource.yml
# Emplacement: Project_homeserver/nas/monitoring/provisioning/datasources/datasource.yml
# Langage: YAML (provisioning Grafana)
# Role: declare automatiquement Loki comme source de donnees dans Grafana au demarrage,
#       pour ne pas avoir a la configurer a la main dans l'interface web.

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
