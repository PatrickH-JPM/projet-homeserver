# Fichier: docker-compose.yml
# Emplacement: Project_homeserver/NAS/pterodactyl/panel/docker-compose.yml
# Langage: YAML (Docker Compose)
# Role: lance le Panel Pterodactyl (interface web d'administration) avec sa base de
#       donnees MariaDB et son cache Redis - c'est la partie que Patrick et son ami
#       utiliseront dans un navigateur pour gerer le serveur Minecraft.

version: "3.8"

networks:
  panel-internal:
    driver: bridge
  homeserver-net:
    external: true

volumes:
  panel-var:
  panel-nginx-logs:
  panel-certs:
  mariadb-data:
  redis-data:

services:
  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "CHANGE_MOI_MOT_DE_PASSE_ROOT"
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "pterodactyl"
      MYSQL_PASSWORD: "CHANGE_MOI_MOT_DE_PASSE_DB"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - panel-internal

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - panel-internal

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    container_name: panel
    restart: unless-stopped
    environment:
      APP_URL: "https://panel.homeserver.local"
      APP_TIMEZONE: "Europe/Paris"
      APP_ENVIRONMENT_ONLY: "false"
      TRUSTED_PROXIES: "*"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      REDIS_HOST: "redis"
      DB_HOST: "mariadb"
      DB_PORT: "3306"
      DB_DATABASE: "panel"
      DB_USERNAME: "pterodactyl"
      DB_PASSWORD: "CHANGE_MOI_MOT_DE_PASSE_DB"
    volumes:
      - panel-var:/app/var/
      - panel-nginx-logs:/app/storage/logs
      - panel-certs:/etc/letsencrypt
    depends_on:
      - mariadb
      - redis
    networks:
      - panel-internal
      - homeserver-net